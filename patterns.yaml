# What to search for, and how to read what comes back. Edit and rerun
# rule_of_many.py --cached; nothing is re-queried unless `search` changes.

# Two families of name for the same thing. Some agencies use the umbrella term;
# others name the specific OPM mechanism. Both are 5 CFR 332.402 referral, where
# everyone at or above a cut score goes to the selecting official.
search:
  rule_of_many: "rule[ -]of[ -](the[ -])?many"
  named_mechanism: "(cut[- ]?off score|cut score|mechanism [abc]\\b|set number of (the )?(highest|applicants|candidates)|top percentage)[^.]{0,90}method under 5 ?c\\.?f\\.?r"

# The rule is being named in order to say it does NOT apply. Almost always a
# direct-hire-authority announcement listing what it's exempt from.
# `many` below stands in for the rule_of_many pattern above.
negated:
  - "many[^.]{0,150}\\b(do|does) not apply"
  - "many[^.]{0,150}\\bnot applicable"
  - "many[^.]{0,150}will not be (used|applied|followed)"
  - "many[^.]{0,150}(are|is) not (used|applied|being used)"
  - "\\b(do|does) not (add|apply)[^.]{0,80}many"
  - "waive[sd]?[^.]{0,80}many"
  - "exempt(ed)? from[^.]{0,80}many"

# The announcement is telling you this is how referral will work.
applied:
  - "(uses|using|use|used|adheres to|applies|applying|apply)[^.]{0,40}many"
  - "many[^.]{0,60}(rating|referral|ranking)? ?procedure"
  - "many[^.]{0,80}5 ?c\\.?f\\.?r"
  - "under (the )?many"
  - "many[^.]{0,120}(numerical(ly)? rank|numeric score|ranked in score order)"
  - "many[^.]{0,120}will be referred"
  - "referred[^.]{0,80}many"
  - "many method"
  - "many[^.]{0,120}not limited to (considering )?the top three"
  - "many referral method"
  - "implement(s|ing|ed)?[^.]{0,40}many"
  - "in the many\\b *,"
  - "information on many"
  # The named-mechanism family. "This announcement uses the Cut Score method
  # under 5 CFR 332.402" is affirmative by construction.
  - "(uses|using) (the |a )?[^.]{0,70}method under 5 ?c\\.?f\\.?r"
  - "(cut[- ]?off score|cut score|mechanism [abc]\\b|set number of|top percentage)[^.]{0,90}method under 5 ?c\\.?f\\.?r"

# Announcements checked by hand whose phrasing the rules above read wrong.
# control number: applied | negated
overrides: {}
